<!-- Demo interactiva de FWL. Todo el CSS va prefijado con .fwl-w para no tocar
     el estilo del libro; el bloque es autocontenido (sin dependencias). -->
<div class="fwl-w" id="fwlDemo">
<style>
.fwl-w{--fw-ink:#17181A;--fw-muted:#6A6C70;--fw-line:#E7E7E3;--fw-soft:#F4F3EF;
  --fw-a:#2f4858;--fw-b:#C0562F;--fw-naive:#9A9C9F;--fw-fit:#17181A;
  border:1px solid var(--fw-line);border-radius:10px;background:#FFF;
  box-shadow:0 1px 4px rgba(0,0,0,.06);margin:1.6em 0;overflow:hidden;
  font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;color:var(--fw-ink);}
.fwl-w *{box-sizing:border-box}
.fwl-w .fw-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(215px,1fr)}
@media (max-width:700px){.fwl-w .fw-top{grid-template-columns:1fr}}
.fwl-w .fw-plot{padding:14px 10px 4px;min-width:0}
.fwl-w .fw-plot svg{display:block;width:100%;height:auto}
.fwl-w .fw-side{border-left:1px solid var(--fw-line);padding:18px 18px 20px;display:flex;flex-direction:column;gap:11px}
@media (max-width:700px){.fwl-w .fw-side{border-left:none;border-top:1px solid var(--fw-line)}}
.fwl-w .fw-no{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--fw-muted);font-weight:700;margin:0}
.fwl-w .fw-ti{font-family:"Fraunces",Georgia,serif;font-size:1.15rem;line-height:1.2;margin:1px 0 0;font-weight:500}
.fwl-w .fw-bo{font-size:.87rem;line-height:1.55;color:var(--fw-muted);margin:0}
.fwl-w .fw-bo b{color:var(--fw-ink);font-weight:600}
.fwl-w .fw-ask{margin-top:auto;border-top:1px dashed var(--fw-line);padding-top:11px;font-size:.85rem;line-height:1.5}
.fwl-w .fw-ask em{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-style:normal;font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--fw-b);font-weight:700;margin-bottom:4px}
.fwl-w .fw-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 18px;border-top:1px solid var(--fw-line);background:var(--fw-soft)}
.fwl-w button{font-family:inherit!important;font-size:.85rem!important;font-weight:500;color:var(--fw-ink)!important;
  background:#FFF!important;border:1px solid var(--fw-line)!important;padding:5px 13px!important;border-radius:6px!important;cursor:pointer;line-height:1.4}
.fwl-w button:hover:not(:disabled){border-color:var(--fw-muted)!important}
.fwl-w button:disabled{opacity:.4;cursor:default}
.fwl-w button.fw-pri{background:var(--fw-ink)!important;color:#FFF!important;border-color:var(--fw-ink)!important}
.fwl-w button[aria-pressed="true"]{background:var(--fw-ink)!important;color:#FFF!important;border-color:var(--fw-ink)!important}
.fwl-w button:focus-visible{outline:2px solid var(--fw-b);outline-offset:2px}
.fwl-w .fw-dots{display:flex;gap:5px;margin-left:auto}
.fwl-w .fw-dot{width:6px;height:6px;border-radius:50%;background:var(--fw-line)}
.fwl-w .fw-dot.on{background:var(--fw-ink)}
.fwl-w .fw-mat{border-top:1px solid var(--fw-line);padding:18px}
.fwl-w .fw-mh{font-family:"Fraunces",Georgia,serif;font-size:1rem;margin:0 0 4px;font-weight:500}
.fwl-w .fw-mp{font-size:.85rem;color:var(--fw-muted);margin:0 0 12px;line-height:1.55}
.fwl-w .fw-tog{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fwl-w .fw-hint{font-size:.78rem;color:var(--fw-muted);margin-left:auto}
.fwl-w .fw-box{overflow-x:auto;display:flex;justify-content:center}
.fwl-w .fw-row{display:flex;align-items:center;gap:11px;width:max-content;margin:0 auto}
.fwl-w .fw-br{position:relative;padding:6px 9px}
.fwl-w .fw-br::before,.fwl-w .fw-br::after{content:"";position:absolute;top:0;bottom:0;width:6px;border-top:1.5px solid var(--fw-muted);border-bottom:1.5px solid var(--fw-muted)}
.fwl-w .fw-br::before{left:0;border-left:1.5px solid var(--fw-muted)}
.fwl-w .fw-br::after{right:0;border-right:1.5px solid var(--fw-muted)}
.fwl-w .fw-c{width:47px;height:28px;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:.76rem;border-radius:3px}
.fwl-w .fw-c.z{color:#B8B9BB}
.fwl-w .fw-c.a{color:var(--fw-a);font-weight:600}
.fwl-w .fw-c.b{color:var(--fw-b);font-weight:600}
.fwl-w .fw-c.v{width:50px;color:var(--fw-ink)}
.fwl-w .fw-tr{display:flex;cursor:pointer;border-radius:4px}
.fwl-w .fw-tr:hover,.fwl-w .fw-tr.on{background:var(--fw-soft)}
.fwl-w .fw-c.on{background:var(--fw-soft)}
.fwl-w .fw-lb{text-align:center;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fw-muted);font-weight:700;margin-top:6px}
.fwl-w .fw-op{font-family:"Fraunces",Georgia,serif;font-size:1.05rem;color:var(--fw-muted)}
.fwl-w .fw-work{margin-top:13px;border-top:1px dashed var(--fw-line);padding-top:11px;font-size:.85rem;min-height:56px}
.fwl-w .fw-work .l{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.78rem;margin-bottom:5px;overflow-x:auto;white-space:nowrap}
.fwl-w .fw-work .g{color:var(--fw-muted);line-height:1.55}
.fwl-w .fw-work .g b{color:var(--fw-ink)}
</style>

<div class="fw-top">
  <div class="fw-plot"><svg id="fwViz" viewBox="0 0 700 440" role="img" aria-label="Salario contra altura, transformado en residuales"></svg></div>
  <div class="fw-side">
    <p class="fw-no" id="fwNo"></p>
    <p class="fw-ti" id="fwTi"></p>
    <p class="fw-bo" id="fwBo"></p>
    <div class="fw-ask"><em>Pregunta</em><span id="fwAsk"></span></div>
  </div>
</div>
<div class="fw-ctl">
  <button id="fwPrev">&larr; Atrás</button>
  <button id="fwNext" class="fw-pri">Siguiente &rarr;</button>
  <button id="fwReset">Reiniciar</button>
  <div class="fw-dots" id="fwDots"></div>
</div>

<div class="fw-mat">
  <p class="fw-mh">La misma limpieza, escrita como matriz</p>
  <p class="fw-mp">Seis personas ordenadas por grupo: tres mujeres y tres hombres. Haz clic en una fila para ver qué hace con los datos.</p>
  <div class="fw-tog">
    <button id="fwBtnM" aria-pressed="true">M &mdash; lo que queda</button>
    <button id="fwBtnP" aria-pressed="false">P &mdash; lo que el sexo predice</button>
    <span class="fw-hint">Clic en una fila</span>
  </div>
  <div class="fw-box"><div class="fw-row">
    <div><div class="fw-br"><div id="fwMat"></div></div><div class="fw-lb" id="fwMatLb"></div></div>
    <span class="fw-op">&middot;</span>
    <div><div class="fw-br"><div id="fwVecY"></div></div><div class="fw-lb">y</div></div>
    <span class="fw-op">=</span>
    <div><div class="fw-br"><div id="fwVecR"></div></div><div class="fw-lb" id="fwResLb"></div></div>
  </div></div>
  <div class="fw-work" id="fwWork"></div>
</div>
</div>

<script>
(function(){
  var R=document.getElementById("fwlDemo"); if(!R) return;
  function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  var rnd=mul(90210);
  function nm(){var u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
  var pts=[];
  for(var i=0;i<90;i++){var h=i>=45?1:0,a=(h?173:160)+nm()*6.5;pts.push({h:h,x:a,y:2+0.9*h+0.018*(a-165)+nm()*0.35});}
  function mean(v){return v.reduce(function(s,q){return s+q},0)/v.length}
  var gm=[0,1].map(function(g){var s=pts.filter(function(p){return p.h===g});
    return {x:mean(s.map(function(p){return p.x})),y:mean(s.map(function(p){return p.y}))}});
  var mx=mean(pts.map(function(p){return p.x})),my=mean(pts.map(function(p){return p.y})),md=mean(pts.map(function(p){return p.h}));
  var Sxx=0,Sxd=0,Sdd=0,Sxy=0,Sdy=0;
  pts.forEach(function(p){var a=p.x-mx,b=p.h-md,c=p.y-my;Sxx+=a*a;Sxd+=a*b;Sdd+=b*b;Sxy+=a*c;Sdy+=b*c;});
  var bS=Sxy/Sxx,aS=my-bS*mx,dt=Sxx*Sdd-Sxd*Sxd,bM=(Sdd*Sxy-Sxd*Sdy)/dt,cM=(Sxx*Sdy-Sxd*Sxy)/dt,aM=my-bM*mx-cM*md;
  function mil(b){return "$"+Math.round(b*1000).toLocaleString("en-US")+" mil/cm";}

  var W=700,H=440,ML=58,MR=18,MT=16,MB=46,PW=W-ML-MR,PH=H-MT-MB,XW=54,YW=3.8;
  var st={s:0,t:0},D;
  function dom(){var cx=mx*(1-st.t),cy=my*(1-st.t);return{x0:cx-XW/2,x1:cx+XW/2,y0:cy-YW/2,y1:cy+YW/2}}
  function sx(v){return ML+(v-D.x0)/(D.x1-D.x0)*PW}
  function sy(v){return MT+PH-(v-D.y0)/(D.y1-D.y0)*PH}
  var svg=document.getElementById("fwViz"),NS="http://www.w3.org/2000/svg";
  function el(n,at){var e=document.createElementNS(NS,n);for(var k in at)e.setAttribute(k,at[k]);return e}
  function tk(lo,hi,s){var o=[],v=Math.ceil(lo/s)*s;for(;v<hi;v+=s)o.push(Math.round(v*1e3)/1e3);return o}
  function line(a,b){return{x1:sx(D.x0),y1:sy(a+b*D.x0),x2:sx(D.x1),y2:sy(a+b*D.x1)}}

  var STEPS=[
   {t:0,ti:"La correlación cruda",bo:"90 trabajadores. La recta dice que cada centímetro extra viene con <b>"+mil(bS).replace("/cm","")+" más al mes</b>.",ask:"¿Conviene invertir en zapatos de plataforma?"},
   {t:0,ti:"Aparece el sexo",bo:"Los mismos puntos, coloreados. Los hombres están <b>a la derecha</b> y <b>arriba</b>. La recta atraviesa dos grupos distintos.",ask:"¿Cuánta de esa pendiente es altura y cuánta es sexo?"},
   {t:0,ti:"Lo que el sexo predice",bo:"Las cruces son el promedio de cada grupo: toda la información que el sexo aporta. Las dos rectas paralelas son el ajuste de la múltiple, y cada una pasa por el promedio de su grupo.",ask:"Si le quitamos a cada persona lo que su sexo predice, ¿qué queda?"},
   {t:1,ti:"Restar el promedio del grupo",bo:"Eso es residualizar. Cada nube se desliza al origen y <b>su forma interna no cambia</b>. Los ejes se leen como sorpresas.",ask:"¿Por qué las dos rectas terminan siendo una sola?"},
   {t:1,ti:"Una sola pendiente",bo:"La pendiente que atraviesa la nube es <b>exactamente</b> el coeficiente de la múltiple. La punteada es la pendiente ingenua: la diferencia es el sesgo, dibujado.",ask:"¿Qué variación de la altura usa esta recta, y cuál se botó?"}
  ];

  function draw(){
    D=dom(); while(svg.firstChild)svg.removeChild(svg.firstChild);
    var s=st.s,t=st.t,gr=s>=1,mn=s>=2&&s<=3,par=s>=2,sim=s<=2,nres=s>=4;
    tk(D.x0,D.x1,10).forEach(function(v){
      svg.appendChild(el("line",{x1:sx(v),y1:MT,x2:sx(v),y2:MT+PH,stroke:"#EFEEEA","stroke-width":1}));
      var l=el("text",{x:sx(v),y:MT+PH+19,"text-anchor":"middle","font-size":11.5,fill:"#6A6C70","font-family":"JetBrains Mono,monospace"});l.textContent=v;svg.appendChild(l);});
    tk(D.y0,D.y1,1).forEach(function(v){
      svg.appendChild(el("line",{x1:ML,y1:sy(v),x2:ML+PW,y2:sy(v),stroke:"#EFEEEA","stroke-width":1}));
      var l=el("text",{x:ML-9,y:sy(v)+4,"text-anchor":"end","font-size":11.5,fill:"#6A6C70","font-family":"JetBrains Mono,monospace"});l.textContent=v.toFixed(1);svg.appendChild(l);});
    if(t>0.02){
      svg.appendChild(el("line",{x1:sx(0),y1:MT,x2:sx(0),y2:MT+PH,stroke:"#6A6C70","stroke-width":1,"stroke-dasharray":"2 3",opacity:t*.6}));
      svg.appendChild(el("line",{x1:ML,y1:sy(0),x2:ML+PW,y2:sy(0),stroke:"#6A6C70","stroke-width":1,"stroke-dasharray":"2 3",opacity:t*.6}));}
    svg.appendChild(el("line",{x1:ML,y1:MT+PH,x2:ML+PW,y2:MT+PH,stroke:"#E7E7E3","stroke-width":1.5}));
    svg.appendChild(el("line",{x1:ML,y1:MT,x2:ML,y2:MT+PH,stroke:"#E7E7E3","stroke-width":1.5}));
    function lab(x,y,tx,op,rot){var e=el("text",{x:x,y:y,"text-anchor":"middle","font-size":12,fill:"#17181A","font-weight":600,opacity:op});
      if(rot)e.setAttribute("transform","rotate(-90 "+x+" "+y+")");e.textContent=tx;svg.appendChild(e);}
    lab(ML+PW/2,H-10,"Altura (cm)",1-t,0); lab(ML+PW/2,H-10,"Altura residual (cm)",t,0);
    lab(15,MT+PH/2,"Salario (millones $)",1-t,1); lab(15,MT+PH/2,"Salario residual",t,1);
    if(sim){var L=line(aS,bS);svg.appendChild(el("line",{x1:L.x1,y1:L.y1,x2:L.x2,y2:L.y2,stroke:"#9A9C9F","stroke-width":2.2,"stroke-dasharray":"7 5",opacity:s===2?.28:1}));}
    if(nres){var L2=line(0,bS);svg.appendChild(el("line",{x1:L2.x1,y1:L2.y1,x2:L2.x2,y2:L2.y2,stroke:"#9A9C9F","stroke-width":2.2,"stroke-dasharray":"7 5"}));}
    if(par){[0,1].forEach(function(g){var a=aM+cM*g-st.t*(gm[g].y-bM*gm[g].x),L=line(a,bM);
      svg.appendChild(el("line",{x1:L.x1,y1:L.y1,x2:L.x2,y2:L.y2,stroke:st.t>.92?"#17181A":(g?"#C0562F":"#2f4858"),"stroke-width":st.t>.92?2.8:2,"stroke-linecap":"round"}));});}
    pts.forEach(function(p){svg.appendChild(el("circle",{cx:sx(p.x-st.t*gm[p.h].x),cy:sy(p.y-st.t*gm[p.h].y),r:4,
      fill:gr?(p.h?"#C0562F":"#2f4858"):"#6A6C70",opacity:gr?.72:.55}));});
    if(mn){[0,1].forEach(function(g){var X=sx(gm[g].x*(1-st.t)),Y=sy(gm[g].y*(1-st.t)),c=g?"#C0562F":"#2f4858";
      svg.appendChild(el("line",{x1:X-10,y1:Y,x2:X+10,y2:Y,stroke:c,"stroke-width":2.4}));
      svg.appendChild(el("line",{x1:X,y1:Y-10,x2:X,y2:Y+10,stroke:c,"stroke-width":2.4}));
      svg.appendChild(el("circle",{cx:X,cy:Y,r:4.5,fill:"#FFF",stroke:c,"stroke-width":2.4}));});}
    if(gr){[["Mujeres","#2f4858"],["Hombres","#C0562F"]].forEach(function(d,i){var y=MT+13+i*18;
      svg.appendChild(el("circle",{cx:ML+13,cy:y-4,r:4.2,fill:d[1],opacity:.8}));
      var t2=el("text",{x:ML+24,y:y,"font-size":11.5,fill:"#6A6C70"});t2.textContent=d[0];svg.appendChild(t2);});}
    if(s===4){var lb=el("text",{x:ML+PW-6,y:MT+PH-12,"text-anchor":"end","font-size":12.5,fill:"#17181A","font-weight":700});
      lb.textContent="β de la múltiple = "+mil(bM);svg.appendChild(lb);}
  }

  var red=window.matchMedia("(prefers-reduced-motion: reduce)").matches,raf=null;
  function anim(g){if(raf)cancelAnimationFrame(raf);if(red){st.t=g;draw();return;}
    var f=st.t,t0=performance.now();
    (function tick(n){var k=Math.min(1,(n-t0)/1400),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
      st.t=f+(g-f)*e;draw();if(k<1)raf=requestAnimationFrame(tick);})(performance.now());}
  var dots=document.getElementById("fwDots");
  STEPS.forEach(function(){var d=document.createElement("div");d.className="fw-dot";dots.appendChild(d);});
  function render(){var S=STEPS[st.s];
    document.getElementById("fwNo").textContent="Paso "+(st.s+1)+" de "+STEPS.length;
    document.getElementById("fwTi").textContent=S.ti;
    document.getElementById("fwBo").innerHTML=S.bo;
    document.getElementById("fwAsk").textContent=S.ask;
    document.getElementById("fwPrev").disabled=st.s===0;
    document.getElementById("fwNext").disabled=st.s===STEPS.length-1;
    Array.prototype.forEach.call(dots.children,function(d,i){d.className="fw-dot"+(i<=st.s?" on":"")});
    anim(S.t);}
  document.getElementById("fwNext").onclick=function(){if(st.s<STEPS.length-1){st.s++;render();}};
  document.getElementById("fwPrev").onclick=function(){if(st.s>0){st.s--;render();}};
  document.getElementById("fwReset").onclick=function(){st.s=0;render();};
  render();

  // ---------- matriz 6x6 ----------
  var Y=[1.80,2.00,2.20,2.90,3.10,3.30],G=[0,0,0,1,1,1],
      NM=["Ana","Beatriz","Carla","Daniel","Esteban","Felipe"],GN=["las mujeres","los hombres"],
      MU=[(1.8+2.0+2.2)/3,(2.9+3.1+3.3)/3],mode="M",sel=-1;
  function cf(m,i,j){if(G[i]!==G[j])return 0;if(m==="P")return 1/3;return i===j?2/3:-1/3;}
  // Nada de ⅔ ni ⅓: las fracciones vulgares se renderizan apiladas y diminutas.
  function gl(m,i,j){var c=cf(m,i,j);if(c===0)return "0";if(m==="P")return "1/3";return i===j?"2/3":"-1/3";}
  function ap(m,i){var s=0;for(var j=0;j<6;j++)s+=cf(m,i,j)*Y[j];return s;}
  function fm(v){if(Math.abs(v)<1e-9)v=0;return (v<0?"−":"")+Math.abs(v).toFixed(2);}
  var mat=document.getElementById("fwMat"),vy=document.getElementById("fwVecY"),vr=document.getElementById("fwVecR"),
      wk=document.getElementById("fwWork"),mlb=document.getElementById("fwMatLb"),rlb=document.getElementById("fwResLb"),
      bM2=document.getElementById("fwBtnM"),bP=document.getElementById("fwBtnP");
  function build(){
    mat.innerHTML="";vy.innerHTML="";vr.innerHTML="";
    for(var i=0;i<6;i++){
      var row=document.createElement("div");row.className="fw-tr"+(i===sel?" on":"");
      row.setAttribute("role","button");row.setAttribute("tabindex","0");
      row.setAttribute("aria-label","Fila "+(i+1)+", "+NM[i]);
      (function(i){row.onclick=function(){sel=(sel===i?-1:i);build();};
        row.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();sel=(sel===i?-1:i);build();}};})(i);
      for(var j=0;j<6;j++){var c=document.createElement("div");
        c.className="fw-c "+(cf(mode,i,j)===0?"z":(G[i]?"b":"a"));c.textContent=gl(mode,i,j);row.appendChild(c);}
      mat.appendChild(row);
      var cy=document.createElement("div");cy.className="fw-c v"+(sel>=0?" on":"");cy.textContent=Y[i].toFixed(2);vy.appendChild(cy);
      var cr=document.createElement("div");cr.className="fw-c v"+(i===sel?" on":"");
      cr.style.fontWeight=(i===sel?"700":"400");cr.textContent=fm(ap(mode,i));vr.appendChild(cr);
    }
    mlb.textContent=mode==="M"?"M (6x6)":"P (6x6)";
    rlb.textContent=mode==="M"?"My = residuo":"Py = promedio";
    bM2.setAttribute("aria-pressed",mode==="M");bP.setAttribute("aria-pressed",mode==="P");
    work();
  }
  function work(){
    if(sel<0){wk.innerHTML='<p class="g">Cada fila es una receta. Haz clic en una para ver qué hace con los datos.</p>';return;}
    var i=sel,tm=[];
    for(var j=0;j<6;j++){var c=cf(mode,i,j);if(c===0)continue;
      var sg=(tm.length===0)?(c<0?"−":""):(c<0?" − ":" + ");
      tm.push(sg+(mode==="P"?"1/3":(i===j?"2/3":"1/3"))+"("+Y[j].toFixed(2)+")");}
    var g;
    if(mode==="M"){var d=Y[i]-MU[G[i]],ad=Math.abs(d);
      g="= "+Y[i].toFixed(2)+" − "+MU[G[i]].toFixed(2)+"  →  <b>"+NM[i]+"</b> gana "+ad.toFixed(2)+
        " millones "+(d<0?"<b>menos</b>":(d>0?"<b>más</b>":"igual"))+" que el promedio de "+GN[G[i]]+
        ". No es un salario: es la distancia al promedio, y por eso puede ser negativa.";}
    else{g="= "+MU[G[i]].toFixed(2)+"  →  el promedio de "+GN[G[i]]+
      ". Es <b>todo lo que el sexo sabe</b> de "+NM[i]+".";}
    wk.innerHTML='<div class="l">'+tm.join("")+" = <b>"+fm(ap(mode,i))+"</b></div><p class=\"g\">"+g+"</p>";
  }
  bM2.onclick=function(){mode="M";build();};
  bP.onclick=function(){mode="P";build();};
  build();
})();
</script>
